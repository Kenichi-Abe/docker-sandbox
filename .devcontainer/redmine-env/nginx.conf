events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80; # Codespacesの外部ポート用（後ほど3000から変更、またはバインド）
        server_name localhost;

        # ⭕ サブディレクトリ /redmine のリバースプロキシ設定
        location /redmine {
            proxy_pass http://localhost:3000; # 後ろに控えるRedmine(WEBrick)へ丸投げ
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # タイムアウト対策（インポート処理が長引いても落ちないように延長）
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # ⭕ CSSや画像などの静的ファイル（アセット）をNginx側で直接超高速配信する設定
        location /redmine/stylesheets/ {
            alias /usr/src/redmine/public/stylesheets/;
        }
        location /redmine/javascripts/ {
            alias /usr/src/redmine/public/javascripts/;
        }
        location /redmine/images/ {
            alias /usr/src/redmine/public/images/;
        }
        location /redmine/plugin_assets/ {
            alias /usr/src/redmine/public/plugin_assets/;
        }
    }
}

